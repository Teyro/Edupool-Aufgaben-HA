<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aufgaben</title>
<style>
  :root {
    --bg: #f3f6f7; --karte: #ffffff; --text: #14252b; --leise: #5d6f76; --linie: #dfe7e9;
    --akzent: #2f6f7b; --punkt: #76a5af; --kopf1: #1f444a; --kopf2: #3b7079; --warn: #b86e00; --warnbg: #fff4e0; --ok: #15803d; --neu: #c2410c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111417; --karte: #1b2127; --text: #eef2f5; --leise: #8e98a6; --linie: #2a323a;
      --akzent: #8fc3cc; --punkt: #76a5af; --kopf1: #183a40; --kopf2: #2c5d66; --warn: #ffb547; --warnbg: #3a2c12; --ok: #69f0ae; --neu: #ff8a65;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif; }
  header { background: linear-gradient(135deg, var(--kopf1), var(--kopf2)); color: #fff; padding: 20px 22px 18px; display: flex; align-items: center; gap: 16px; }
  .zahl { font-size: 46px; font-weight: 800; line-height: 1; color: #ffd166; min-width: 1.2ch; }
  .titel b { display: block; font-size: 19px; }
  .titel span { font-size: 13px; color: #cfe4e7; }
  header .platz { flex: 1; }
  button { font: inherit; cursor: pointer; }
  .rund { width: 44px; height: 44px; border-radius: 50%; border: 0; background: #ffffff26; color: #fff; display: grid; place-items: center; }
  .rund:hover { background: #ffffff3a; }
  .rund svg { width: 22px; height: 22px; }
  .dreht svg { animation: drehen 0.9s linear infinite; }
  @keyframes drehen { to { transform: rotate(360deg); } }
  main { padding: 16px; max-width: 1500px; margin: 0 auto; }
  .hinweis { background: var(--warnbg); color: var(--warn); border-radius: 12px; padding: 10px 14px; margin-bottom: 14px; font-weight: 600; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .spalten { display: grid; gap: 14px; }
  @media (min-width: 900px) { .spalten { grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: start; } }
  section { background: var(--karte); border-radius: 14px; padding: 12px 14px 6px; box-shadow: 0 1px 2px #0000000f; }
  section h2 { margin: 0 0 6px; font-size: 13px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--akzent); display: flex; align-items: center; gap: 8px; }
  section h2 .anz { font-weight: 400; color: var(--leise); letter-spacing: 0; }
  section.erledigt h2 { color: var(--leise); }
  .leer { color: var(--leise); font-size: 13px; padding: 4px 0 10px; }
  a.aufgabe { display: block; text-decoration: none; color: inherit; padding: 9px 0 10px; border-top: 1px solid var(--linie); }
  a.aufgabe:first-of-type { border-top: 0; }
  a.aufgabe:hover .t { text-decoration: underline; }
  .zeile { display: flex; align-items: baseline; gap: 8px; }
  .punkt { width: 7px; height: 7px; border-radius: 50%; background: var(--punkt); flex: 0 0 auto; transform: translateY(-2px); }
  .t { font-weight: 650; flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .d { color: var(--leise); font-size: 12px; font-weight: 300; white-space: nowrap; }
  .b { color: var(--leise); font-weight: 300; font-size: 13.5px; margin: 2px 0 0 15px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .board { color: var(--leise); font-size: 12px; margin: 2px 0 0 15px; }
  section.erledigt .t { font-weight: 400; color: var(--leise); text-decoration: line-through; text-decoration-color: #8e98a666; }
  section.erledigt .punkt { background: var(--linie); }
  .verbinden { background: var(--karte); border-radius: 16px; padding: 22px; max-width: 560px; margin: 10px auto; }
  .verbinden h2 { margin-top: 0; }
  .verbinden ol { padding-left: 20px; color: var(--text); }
  .code { font: 700 30px/1.2 ui-monospace, Menlo, monospace; letter-spacing: .12em; background: var(--bg); border-radius: 12px; padding: 12px 16px; text-align: center; margin: 14px 0; }
  .knopf { display: inline-block; border: 0; border-radius: 10px; padding: 11px 18px; background: var(--akzent); color: #fff; font-weight: 700; text-decoration: none; }
  @media (prefers-color-scheme: dark) { .knopf { color: #10282c; } }
  .knopf.zart { background: transparent; color: var(--akzent); border: 1px solid var(--linie); }
  .warte { color: var(--leise); margin-top: 12px; }
  footer { color: var(--leise); font-size: 12px; text-align: center; padding: 18px; }
  footer button { background: none; border: 0; color: var(--leise); text-decoration: underline; padding: 0 4px; }
  .tabs { display: flex; gap: 6px; }
  .tabs button { background: #ffffff1f; color: #cfe4e7; border: 0; border-radius: 999px; padding: 7px 16px; font-weight: 700; font-size: 14px; }
  .tabs button.aktiv { background: #fff; color: var(--kopf1); }
  .st { background: var(--karte); border-radius: 14px; padding: 12px 15px; margin: 10px 0; box-shadow: 0 1px 2px #0000000f; }
  .st .kopf { display: flex; align-items: baseline; gap: 10px; }
  .st .kopf b { font-size: clamp(16px, 3.6vw, 19px); font-weight: 650; flex: 1; }
  .st.erl .kopf b { font-weight: 400; color: var(--leise); text-decoration: line-through; text-decoration-color: #8e98a655; }
  .st .d { color: var(--leise); font-size: 13px; white-space: nowrap; }
  .st .wer { font-size: 14px; margin-top: 3px; }
  .st .wer.neu { color: var(--warn); font-weight: 600; }
  .st .wer.arbeit { color: var(--ok, #15803d); font-weight: 600; }
  .st .meta { color: var(--leise); font-size: 13px; margin-top: 2px; }
  .st .text { color: var(--text); font-size: 14px; margin-top: 6px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .code-box { background: var(--karte); border-radius: 14px; padding: 18px; margin: 10px 0; max-width: 460px; }
  .code-box input { font: 700 24px/1 ui-monospace, Menlo, monospace; letter-spacing: .3em; width: 7ch; text-align: center; padding: 10px; border-radius: 10px; border: 1px solid var(--linie); background: var(--bg); color: var(--text); }
</style>
</head>
<body>
<header>
  <div class="zahl" id="zahl">–</div>
  <div class="titel"><b id="kopfText">offene Aufgaben</b><span id="kopfUnter">Edupool Boards</span></div>
  <div class="tabs" id="tabs" hidden></div>
  <div class="platz"></div>
  <button class="rund" id="neu" title="Jetzt aktualisieren" aria-label="Jetzt aktualisieren">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
  </button>
</header>
<main id="inhalt"></main>
<footer id="fuss"></footer>
<script>
"use strict";
// Alle Texte aus Edupool kommen nur über textContent in die Seite – nie als HTML.
const $ = (id) => document.getElementById(id);
const el = (tag, klasse, text) => { const e = document.createElement(tag); if (klasse) e.className = klasse; if (text !== undefined) e.textContent = text; return e; };
let letzter = null, timer = null, ansicht = "aufgaben";

function datumKurz(ms) {
  if (!ms) return "";
  const t = new Date(ms), h = new Date();
  const tag = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diff = Math.round((tag(h) - tag(t)) / 86400000);
  const zeit = (t.getHours() || t.getMinutes()) ? " " + String(t.getHours()).padStart(2, "0") + ":" + String(t.getMinutes()).padStart(2, "0") : "";
  if (diff === 0) return "heute" + zeit;
  if (diff === 1) return "gestern";
  return t.getDate() + "." + (t.getMonth() + 1) + ".";
}
const uhr = (ms) => new Date(ms).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });

async function post(pfad, koerper) {
  const r = await fetch(pfad, { method: "POST", headers: { "X-Edupool": "1", "Content-Type": "application/json" }, body: koerper ? JSON.stringify(koerper) : undefined });
  const d = await r.json();
  if (!r.ok) throw new Error(d.fehler || "HTTP " + r.status);
  return d;
}

function tabs(s) {
  const t = $("tabs");
  const hatIserv = s.iserv && s.iserv.aktiv;
  t.hidden = !hatIserv;
  if (!hatIserv) { ansicht = "aufgaben"; return; }
  t.replaceChildren();
  for (const [id, name] of [["aufgaben", "Aufgaben"], ["stoerungen", "Störungen"]]) {
    const b = el("button", ansicht === id ? "aktiv" : "", name);
    if (id === "stoerungen" && s.iserv.stand) b.textContent = `Störungen (${s.iserv.stand.anzahl})`;
    b.onclick = () => { ansicht = id; zeigen(letzter); };
    t.append(b);
  }
}

function zeigen(s) {
  letzter = s;
  tabs(s);
  if (ansicht === "stoerungen") return zeigeStoerungen(s);
  zeigeAufgaben(s);
}

function zeigeAufgaben(s) {
  const inhalt = $("inhalt");
  inhalt.replaceChildren();
  $("neu").classList.toggle("dreht", !!s.abrufLaeuft);
  $("neu").hidden = !s.verbunden;
  if (!s.verbunden) {
    $("zahl").textContent = "–";
    $("kopfText").textContent = "offene Aufgaben";
    $("kopfUnter").textContent = "nicht verbunden";
    inhalt.append(verbindenAnsicht(s));
    fuss(s);
    return;
  }
  const st = s.stand;
  $("zahl").textContent = st ? st.offen : "…";
  $("kopfText").textContent = st && st.offen === 1 ? "offene Aufgabe" : "offene Aufgaben";
  $("kopfUnter").textContent = st ? `Stand ${uhr(st.ts)} · alle ${s.intervall} Min. · ${st.boards} Board${st.boards === 1 ? "" : "s"}` : "wird geladen …";
  if (s.fehler) {
    const h = el("div", "hinweis", "⚠︎ " + s.fehler.text);
    if (s.fehler.verbindung) { const k = el("button", "knopf", "Neu verbinden"); k.onclick = () => aktion("api/verbinden"); h.append(k); }
    inhalt.append(h);
    if (s.verbinden && s.verbinden.status === "wartet") inhalt.append(verbindenAnsicht(s));
  }
  if (st) {
    const spalten = el("div", "spalten");
    for (const g of st.gruppen) {
      const sec = el("section", g.erledigt ? "erledigt" : "");
      const h2 = el("h2", "", g.name);
      h2.append(el("span", "anz", String(g.aufgaben.length)));
      sec.append(h2);
      if (!g.aufgaben.length) sec.append(el("div", "leer", "keine"));
      for (const a of g.aufgaben) {
        const link = el("a", "aufgabe");
        link.href = s.edupool + "/boards/" + encodeURIComponent(a.board);
        link.target = "_blank"; link.rel = "noopener noreferrer";
        const z = el("div", "zeile");
        z.append(el("span", "punkt"), el("span", "t", a.titel), el("span", "d", datumKurz(a.geaendert)));
        link.append(z);
        if (a.beschreibung) link.append(el("div", "b", a.beschreibung));
        if (st.mehrereBoards) link.append(el("div", "board", a.boardTitel));
        sec.append(link);
      }
      spalten.append(sec);
    }
    inhalt.append(spalten);
  }
  fuss(s);
}

function uebernommen(m) { return !m.erledigt && (!!m.bearbeiter || !m.unbesetzt); }
function werText(m) {
  if (m.erledigt) return "✓ " + (m.bearbeiter || m.status || "erledigt");
  if (m.bearbeiter) return "🛠 " + m.bearbeiter;
  return m.unbesetzt ? "🆕 noch niemand" : "🛠 " + (m.status || "in Arbeit");
}

function zeigeStoerungen(s) {
  const inhalt = $("inhalt");
  inhalt.replaceChildren();
  const iv = s.iserv || {};
  const st = iv.stand;
  $("neu").classList.toggle("dreht", !!iv.abrufLaeuft);
  $("neu").hidden = false;
  $("zahl").textContent = st ? st.anzahl : (iv.fehler ? "!" : "…");
  $("kopfText").textContent = st && st.anzahl === 1 ? "offene Störung" : "offene Störungen";
  $("kopfUnter").textContent = st ? `Stand ${uhr(st.ts)} · alle ${iv.intervall} Min.${st.ohneBearbeiter ? " · " + st.ohneBearbeiter + " noch ohne Bearbeiter" : ""}` : "wird geladen …";

  if (iv.codeNoetig) inhalt.append(codeAnsicht());
  if (iv.fehler && !iv.codeNoetig) {
    const h = el("div", "hinweis", "⚠︎ " + iv.fehler.text);
    inhalt.append(h);
  }
  if (st && st.meldungen.length) {
    for (const m of st.meldungen) {
      const box = el("div", "st" + (m.erledigt ? " erl" : ""));
      const kopf = el("div", "kopf");
      kopf.append(el("b", "", m.titel), el("span", "d", datumKurz(m.datum)));
      box.append(kopf);
      box.append(el("div", "wer " + (m.erledigt ? "" : uebernommen(m) ? "arbeit" : "neu"), [m.autor ? "von " + m.autor : "", werText(m)].filter(Boolean).join(" · ")));
      const meta = [m.kategorie, m.ort].filter(Boolean).join(" · ");
      if (meta) box.append(el("div", "meta", meta));
      if (m.inhalt) box.append(el("div", "text", m.inhalt));
      inhalt.append(box);
    }
  } else if (st) {
    inhalt.append(el("div", "leer", "✅ Keine offenen Störungen"));
  }
  fuss(s);
}

function codeAnsicht() {
  const box = el("div", "code-box");
  box.append(el("h2", "", "Zwei-Faktor-Code"));
  box.append(el("p", "", "IServ verlangt den 6-stelligen Code aus deiner Authenticator-App. Gib ihn hier ein; danach meldet sich das Add-on allein an."));
  const eingabe = el("input");
  eingabe.setAttribute("inputmode", "numeric");
  eingabe.setAttribute("maxlength", "6");
  eingabe.placeholder = "123456";
  const k = el("button", "knopf", "Anmelden");
  k.style.marginLeft = "10px";
  k.onclick = async () => { const c = eingabe.value.replace(/\D/g, ""); if (c.length >= 6) { k.disabled = true; try { zeigen(await post("api/stoerungen/code", { code: c })); } catch (e) { alert(e.message); k.disabled = false; } } };
  const zeile = el("div"); zeile.style.marginTop = "12px"; zeile.append(eingabe, k);
  box.append(zeile);
  return box;
}

function verbindenAnsicht(s) {
  const box = el("div", "verbinden");
  box.append(el("h2", "", "Mit Edupool Boards verbinden"));
  const v = s.verbinden;
  if (!v || v.status !== "wartet") {
    if (v && v.status === "abgelaufen") box.append(el("p", "", "Der Code ist abgelaufen – bitte noch einmal starten."));
    if (v && (v.status === "abgelehnt" || v.status === "fehler")) box.append(el("p", "", "Die Freigabe hat nicht geklappt: " + (v.text || v.status)));
    if (v && v.status === "fertig") box.append(el("p", "", "Verbunden – die Aufgaben werden geladen …"));
    const p = el("p", "", "Das Add-on bekommt eine Lese-Freigabe für deine Boards. Dein Passwort sieht es nie; widerrufen kannst du die Freigabe jederzeit in Edupool Boards.");
    const k = el("button", "knopf", "Verbinden");
    k.onclick = () => aktion("api/verbinden");
    box.append(p, k);
    return box;
  }
  const ol = el("ol");
  ol.append(el("li", "", "„Freigabeseite öffnen“ – sie öffnet sich in einem neuen Tab. Mit dem Schulkonto anmelden."));
  ol.append(el("li", "", "Prüfen, dass dieser Code eingetragen ist:"));
  box.append(ol, el("div", "code", v.code));
  const ol2 = el("ol"); ol2.start = 3;
  ol2.append(el("li", "", "Nur „Lesen“ anhaken, Laufzeit wählen (z. B. 90 Tage), alle Boards, bestätigen."));
  box.append(ol2);
  const link = el("a", "knopf", "Freigabeseite öffnen");
  link.href = v.seite; link.target = "_blank"; link.rel = "noopener noreferrer";
  box.append(link);
  const rest = Math.max(0, Math.round((v.ablauf - Date.now()) / 60000));
  box.append(el("div", "warte", `Warte auf deine Bestätigung … (Code gilt noch ${rest} Min.)`));
  return box;
}

function fuss(s) {
  const f = $("fuss");
  f.replaceChildren(document.createTextNode(`Edupool Aufgaben ${s.version}`));
  if (ansicht === "aufgaben" && s.verbunden) {
    f.append(document.createTextNode(" · "));
    const t = el("button", "", "Verbindung entfernen");
    t.onclick = async () => { if (confirm("Verbindung zu Edupool Boards entfernen? Widerrufen kannst du die Freigabe zusätzlich in Edupool Boards.")) await aktion("api/trennen"); };
    f.append(t);
  }
}

async function aktion(pfad) {
  try {
    $("neu").classList.add("dreht");
    zeigen(await post(pfad));
  } catch (e) { alert("Nicht geklappt: " + e.message); }
  planen();
}

async function laden() {
  try {
    const r = await fetch("api/status", { cache: "no-store" });
    zeigen(await r.json());
  } catch (e) { $("kopfUnter").textContent = "Add-on nicht erreichbar"; }
  planen();
}
function planen() {
  clearTimeout(timer);
  const l = letzter || {};
  const wartet = l.verbinden && l.verbinden.status === "wartet";
  const laeuft = (ansicht === "aufgaben" ? l.abrufLaeuft : l.iserv && l.iserv.abrufLaeuft);
  timer = setTimeout(laden, wartet || laeuft ? 3000 : 60000);
}

$("neu").onclick = () => aktion(ansicht === "stoerungen" ? "api/stoerungen/aktualisieren" : "api/aktualisieren");
laden();

</script>
</body>
</html>
