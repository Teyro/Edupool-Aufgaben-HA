name: Edupool Aufgaben
version: "1.0.0"
slug: edupool_aufgaben
description: Deine Aufgaben aus Edupool Boards (Hamburg) – Liste in der Seitenleiste und Sensor mit der Zahl offener Aufgaben
url: https://github.com/Teyro/Edupool-Aufgaben-HA
arch:
  - aarch64
  - amd64
  - armv7
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:clipboard-check-outline
panel_title: Aufgaben
homeassistant_api: true
options:
  farbe: "#76a5af"
  intervall_minuten: 15
  boards: []
  titel_im_sensor: false
schema:
  farbe: match(^#?[0-9a-fA-F]{6}$)
  intervall_minuten: int(5,1440)
  boards:
    - int
  titel_im_sensor: bool
